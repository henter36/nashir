name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Checkout Nashir authority
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: henter36/nashir
          ref: e22c84fa0e2b6c01d4ee98383ef9fad2d0fa3337
          path: nashir-authority
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: apps/api/package.json

      - name: Install backend dependencies
        working-directory: apps/api
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/api
        run: pnpm lint

      - name: Format check
        working-directory: apps/api
        run: pnpm run format:check

      - name: Typecheck
        working-directory: apps/api
        run: pnpm typecheck

      - name: Test
        working-directory: apps/api
        run: pnpm test

      - name: Validate contract authority
        working-directory: apps/api
        run: >-
          pnpm run validate:contract-authority --
          --authority-repo "${{ github.workspace }}/nashir-authority"
          --authority-ref e22c84fa0e2b6c01d4ee98383ef9fad2d0fa3337

      - name: Validate contracts
        working-directory: apps/api
        run: pnpm run validate:contracts -- --authority-repo "${{ github.workspace }}"

      - name: Validate runtime conformance
        working-directory: apps/api
        run: pnpm run validate:runtime-conformance -- --authority-repo "${{ github.workspace }}"

  database-tests:
    name: Validate backend database tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nashir
          POSTGRES_DB: nashir_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nashir -d nashir_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://nashir@127.0.0.1:5432/nashir_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: apps/api/package.json

      - name: Install backend dependencies
        working-directory: apps/api
        run: pnpm install --frozen-lockfile

      - name: Test DB migrations
        working-directory: apps/api
        run: pnpm run test:db

