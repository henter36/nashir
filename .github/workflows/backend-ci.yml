name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: apps/api/package.json

      - name: Install backend dependencies
        working-directory: apps/api
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/api
        run: pnpm lint

      - name: Format check
        working-directory: apps/api
        run: pnpm run format:check

      - name: Typecheck
        working-directory: apps/api
        run: pnpm typecheck

      - name: Test
        working-directory: apps/api
        run: pnpm test

      - name: Validate contract authority
        working-directory: apps/api
        run: >-
          pnpm run validate:contract-authority --
          --authority-repo "${{ github.workspace }}"
          --authority-ref e22c84fa0e2b6c01d4ee98383ef9fad2d0fa3337

      - name: Validate contracts
        working-directory: apps/api
        run: pnpm run validate:contracts -- --authority-repo "${{ github.workspace }}"

      - name: Validate runtime conformance
        working-directory: apps/api
        run: pnpm run validate:runtime-conformance -- --authority-repo "${{ github.workspace }}"
