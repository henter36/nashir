          $ref: "#/components/schemas/PaginationMeta"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Nashir V1 bearer token. Issued by the approved Nashir auth provider.
        Carries userId and workspace membership context.
        Raw secret values, platform credentials, and OAuth tokens must never appear
        in any request or response field regardless of authentication state.
