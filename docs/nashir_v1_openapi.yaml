openapi: 3.1.0
info:
  title: Nashir V1 API
  version: 0.1.0
  description: Contract-first API for Nashir V1. Slice 1 covers Products and Assets. Slice 2 adds Campaign Content + Review/Preview metadata only. Slice 3 adds AI readiness snapshot endpoints; all are read-only and advisory only. Slice 4 adds Creator Studio session, context draft, readiness assessment, and transfer draft endpoints; all are draft-only and do not execute AI, publish content, scrape platforms, or create real destination records.
servers:
  - url: https://api.example.invalid
    description: Placeholder server. Not a production endpoint.
tags:
  - name: Health
    description: Basic service status checks.
  - name: Products
    description: Product catalog metadata. Product names are display fields only; productId is canonical.
  - name: Assets
    description: Asset library metadata. Asset names and file names are display fields only; assetId is canonical.
  - name: Campaign Content
    description: Campaign content drafts, review state, and preview metadata. Slice 2 does not execute AI, publish, schedule, upload binaries, or run external integrations.
  - name: AI Readiness
    description: Read-only readiness snapshot endpoints for AI operations. All results are advisory only and do not authorize or gate workflow execution. Slice 3 does not execute AI, trigger workflows, probe providers, create artifacts, or write audit records.
  - name: Creator Studio
    description: Creator Studio session, context draft, readiness assessment, and transfer draft endpoints. All transfer drafts are draft-only; no AI execution, scraping, publishing, or real destination record creation occurs. Transfer endpoints require CreatorContextDraft status ready_for_transfer and create pending_review drafts only.
  - name: Workspace
    description: Workspace identity and settings. All merchant-owned resources are scoped to a workspace. workspaceId is path-derived and must never be supplied in a request body.
  - name: Members
    description: Workspace membership management. Active membership is required for all workspace-scoped operations. Invited and suspended members are denied access.
  - name: StoreProfile
    description: Store profile for the workspace. One StoreProfile per workspace in V1.
  - name: DataSources
    description: Data source connection records. Connection status and metadata only; credentials are managed separately via IntegrationCredentials.
  - name: ChannelConnections
    description: Channel and platform connection records. No raw credentials on ChannelConnection; optional dataSourceId link.
  - name: IntegrationCredentials
    description: Vault-backed credential references for workspace integrations. Raw secret values are never returned. Write-only where applicable.
  - name: Campaigns
    description: Campaign records and lifecycle. Campaign and CampaignBrief manage the campaign context. Content items and publishing are managed separately.
  - name: CampaignContentItems
    description: Campaign content item records. Nested under a Campaign; also queryable workspace-wide for studio views.
  - name: ContentDrafts
    description: Content draft records. Versioned draft body for a CampaignContentItem. Lifecycle state naming is deferred to the OpenAPI YAML review gate.
  - name: ContentApprovals
    description: Content approval and rejection records. Human-initiated only. Self-approval is forbidden at the service layer.
  - name: PublishingJobs
    description: Publishing job records and lifecycle. Manual confirmation required. Published status is simulated in V1; no real external publishing occurs.
  - name: PublishingStatus
    description: Append-only status trail for a PublishingJob. Server-written only; no client writes.
  - name: AnalyticsSnapshots
    description: Analytics snapshot records. sourceSummary is required on every snapshot. Status enum is approved as available/partial/stale/unavailable.
  - name: AuditEvents
    description: Append-only audit event trail. Admin and owner access only. No client writes.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      x-workspace-scope: none
      x-store-scope: none
      x-human-review-required: false
      x-audit-required: false
      x-evidence-required: false
      x-sensitive-operation: false
      x-no-automatic-execution: false
      tags:
        - Health
      summary: Get service health.
      description: Returns a simple placeholder health response for contract validation.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Service health response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/DefaultError"
