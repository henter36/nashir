        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishingJobCreateRequest"
      responses:
        "201":
          description: Publishing job created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingJobResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/DefaultError"
  /workspaces/{workspaceId}/publishing-jobs/{publishingJobId}:
    get:
      operationId: getPublishingJob
      x-permission: nashir.publishing.read
      x-workspace-scope: route
      x-human-review-required: false
      x-audit-required: false
      x-sensitive-operation: false
      x-guard-chain:
        - authGuard
        - workspaceContextGuard
        - membershipCheck
        - permissionGuard
      tags:
        - PublishingJobs
      summary: Get publishing job.
      description: Returns a PublishingJob record. Requires publishing.read permission.
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - $ref: "#/components/parameters/PublishingJobIdPath"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Publishing job response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingJobResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updatePublishingJob
      x-permission: nashir.publishing.manage
      x-workspace-scope: route
      x-human-review-required: false
      x-audit-required: true
      x-sensitive-operation: false
      x-guard-chain:
        - authGuard
        - workspaceContextGuard
        - membershipCheck
        - permissionGuard
        - rejectBodyWorkspaceId
      tags:
        - PublishingJobs
      summary: Update publishing job.
      description: Updates a PublishingJob record before confirmation. Requires publishing.manage permission. Emits audit event.
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - $ref: "#/components/parameters/PublishingJobIdPath"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishingJobUpdateRequest"
      responses:
        "200":
          description: Publishing job updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingJobResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/DefaultError"
  /workspaces/{workspaceId}/publishing-jobs/{publishingJobId}/confirm:
    post:
      operationId: confirmPublishingJob
      x-permission: nashir.publishing.manage
      x-workspace-scope: route
      x-human-review-required: true
      x-audit-required: true
      x-sensitive-operation: false
      x-guard-chain:
        - authGuard
        - workspaceContextGuard
        - membershipCheck
        - permissionGuard
      tags:
        - PublishingJobs
      summary: Confirm publishing job.
      description: Confirms a scheduled PublishingJob. Human confirmation required. Requires publishing.manage permission (publisher, admin, or owner). Returns 409 if already confirmed or cancelled. Emits audit event.
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - $ref: "#/components/parameters/PublishingJobIdPath"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Publishing job confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingJobResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /workspaces/{workspaceId}/publishing-jobs/{publishingJobId}/cancel:
    post:
      operationId: cancelPublishingJob
      x-permission: nashir.publishing.manage
      x-workspace-scope: route
      x-human-review-required: true
      x-audit-required: true
      x-sensitive-operation: false
      x-guard-chain:
        - authGuard
        - workspaceContextGuard
        - membershipCheck
        - permissionGuard
      tags:
        - PublishingJobs
      summary: Cancel publishing job.
      description: Cancels a PublishingJob. Requires publishing.manage permission. Returns 409 if already cancelled or completed. Emits audit event.
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - $ref: "#/components/parameters/PublishingJobIdPath"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Publishing job cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingJobResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /workspaces/{workspaceId}/publishing-status:
    get:
      operationId: listPublishingStatus
      x-permission: nashir.publishing.read
      x-workspace-scope: route
      x-human-review-required: false
      x-audit-required: false
      x-sensitive-operation: false
      x-guard-chain:
        - authGuard
        - workspaceContextGuard
        - membershipCheck
        - permissionGuard
      tags:
        - PublishingStatus
      summary: List publishing status records.
      description: Lists PublishingStatus records across all publishing jobs in the workspace. Append-only source; no client writes. Requires publishing.read permission.
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Publishing status list response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingStatusListResponse"
        default:
          $ref: "#/components/responses/DefaultError"
  /workspaces/{workspaceId}/analytics-snapshots:
    get:
      operationId: listAnalyticsSnapshots
      x-permission: nashir.analytics.read
      x-workspace-scope: route
      x-human-review-required: false
      x-audit-required: false
      x-sensitive-operation: false
      x-guard-chain:
        - authGuard
        - workspaceContextGuard
        - membershipCheck
        - permissionGuard
      tags:
        - AnalyticsSnapshots
      summary: List analytics snapshots.
      description: Lists AnalyticsSnapshot records for the workspace. sourceSummary is required on every snapshot to distinguish real from mock or partial data. Requires analytics.read permission.
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Analytics snapshot list response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSnapshotListResponse"
        default:
          $ref: "#/components/responses/DefaultError"
  /workspaces/{workspaceId}/analytics-snapshots/{analyticsSnapshotId}:
    get:
      operationId: getAnalyticsSnapshot
      x-permission: nashir.analytics.read
      x-workspace-scope: route
      x-human-review-required: false
      x-audit-required: false
      x-sensitive-operation: false
      x-guard-chain:
        - authGuard
        - workspaceContextGuard
        - membershipCheck
        - permissionGuard
      tags:
        - AnalyticsSnapshots
      summary: Get analytics snapshot.
      description: Returns a single AnalyticsSnapshot record. sourceSummary field is required; status must be one of the approved enum values. Requires analytics.read permission.
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - $ref: "#/components/parameters/AnalyticsSnapshotIdPath"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Analytics snapshot response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSnapshotResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /workspaces/{workspaceId}/audit-events:
    get:
      operationId: listAuditEvents
      x-permission: nashir.audit_events.read
      x-workspace-scope: route
      x-human-review-required: false
      x-audit-required: false
      x-sensitive-operation: false
      x-guard-chain:
        - authGuard
        - workspaceContextGuard
        - membershipCheck
        - permissionGuard
      tags:
        - AuditEvents
      summary: List audit events.
      description: Lists AuditEvent records for the workspace. Append-only source; no client writes or deletes. Requires audit_events.read permission (admin or owner only).
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Audit event list response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListResponse"
        default:
          $ref: "#/components/responses/DefaultError"
components:
  parameters:
    WorkspaceIdPath:
      name: workspaceId
      in: path
      required: true
      description: Stable opaque workspace identifier.
      schema:
        type: string
        minLength: 1
    ProductIdPath:
      name: productId
      in: path
      required: true
      description: Stable opaque product identifier. Product names are not identity.
      schema:
        type: string
        minLength: 1
    AssetIdPath:
      name: assetId
      in: path
      required: true
      description: Stable opaque asset identifier. Asset names and file names are not identity.
      schema:
        type: string
        minLength: 1
    CampaignContentIdPath:
      name: campaignContentId
      in: path
      required: true
      description: Stable opaque campaign content identifier. Campaign content titles are not identity.
      schema:
        type: string
        minLength: 1
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Cursor for the next page.
      schema:
        type: string
    StatusQuery:
      name: status
      in: query
      required: false
      description: Optional resource status filter.
      schema:
        type: string
    UpdatedAfterQuery:
      name: updatedAfter
      in: query
      required: false
      description: Return resources updated after this timestamp.
      schema:
        type: string
        format: date-time
    SortQuery:
      name: sort
      in: query
      required: false
      description: Stable sort expression such as updatedAt:desc.
      schema:
        type: string
    AssetTypeQuery:
      name: type
      in: query
      required: false
      description: Optional asset type filter.
      schema:
        $ref: "#/components/schemas/AssetType"
    LinkedProductIdQuery:
      name: linkedProductId
      in: query
      required: false
      description: Optional product link filter.
      schema:
        type: string
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Required for POST create/link operations to prevent duplicate writes.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    IfMatchHeader:
      name: If-Match
      in: header
      required: false
      description: Optional concurrency token. PUT operations require either If-Match or X-Resource-Version.
      schema:
        type: string
    ResourceVersionHeader:
      name: X-Resource-Version
      in: header
      required: false
      description: Optional resource version. PUT operations require either If-Match or X-Resource-Version.
      schema:
        type: string
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: Optional client request tracking identifier.
      schema:
        type: string
    WorkflowDefinitionIdPath:
      name: workflowDefinitionId
      in: path
      required: true
      description: Stable opaque workflow definition identifier.
      schema:
        type: string
        minLength: 1
    StepKeyPath:
      name: stepKey
      in: path
      required: true
      description: Stable step key within the composite scope (workflowDefinitionId, workflowVersion) only. Not a user-facing display label.
      schema:
        type: string
        minLength: 1
    ProviderIdPath:
      name: providerId
      in: path
      required: true
      description: Stable opaque AI provider identifier.
      schema:
        type: string
        minLength: 1
    ModelRouteIdPath:
      name: modelRouteId
      in: path
      required: true
      description: Stable opaque model route identifier.
      schema:
        type: string
        minLength: 1
    PromptIdPath:
      name: promptId
      in: path
      required: true
      description: Stable opaque prompt identifier.
      schema:
        type: string
        minLength: 1
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      description: Stable opaque Creator Studio session identifier.
      schema:
        type: string
        minLength: 1
    DraftIdPath:
      name: draftId
      in: path
      required: true
      description: Stable opaque Creator Studio context draft identifier.
      schema:
        type: string
        minLength: 1
    TransferIdPath:
      name: transferId
      in: path
      required: true
      description: Stable opaque Creator Studio transfer draft identifier.
      schema:
        type: string
        minLength: 1
    MemberIdPath:
      name: memberId
      in: path
      required: true
      description: Stable opaque workspace member identifier.
      schema:
        type: string
        minLength: 1
    DataSourceIdPath:
      name: dataSourceId
      in: path
      required: true
      description: Stable opaque data source identifier.
      schema:
        type: string
        minLength: 1
    ChannelConnectionIdPath:
      name: channelConnectionId
      in: path
      required: true
      description: Stable opaque channel connection identifier.
      schema:
        type: string
        minLength: 1
    IntegrationCredentialIdPath:
      name: integrationCredentialId
      in: path
      required: true
      description: Stable opaque integration credential reference identifier. Does not contain or imply a raw secret value.
      schema:
        type: string
        minLength: 1
    CampaignIdPath:
      name: campaignId
      in: path
      required: true
      description: Stable opaque campaign identifier.
      schema:
        type: string
        minLength: 1
    PublishingJobIdPath:
      name: publishingJobId
      in: path
      required: true
      description: Stable opaque publishing job identifier.
      schema:
        type: string
        minLength: 1
    AnalyticsSnapshotIdPath:
      name: analyticsSnapshotId
      in: path
      required: true
      description: Stable opaque analytics snapshot identifier.
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    Unauthorized:
      description: Authentication is required or was not accepted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    PermissionDenied:
      description: Permission denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    Conflict:
      description: Conflict, idempotency conflict, or version mismatch.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    ValidationFailed:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    Gone:
      description: Resource existed but has passed its TTL or been invalidated by an expired parent. Distinguishes from 404 (never existed).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    DefaultError:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
  schemas:
    HealthResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - service
            - status
            - version
          properties:
            service:
              type: string
              example: nashir-v1-api
            status:
              type: string
              enum:
                - ok
                - degraded
            version:
              type: string
              example: 0.1.0
    ErrorCode:
      type: string
      enum:
        - workspace.not_found
        - resource.not_found
        - validation.failed
        - permission.denied
        - conflict.version_mismatch
        - idempotency.conflict
        - rate_limit.exceeded
        - review.required
        - publishing.blocked
        - provider.not_ready
        - model_route.not_ready
        - prompt_template.not_approved
        - cost_policy.exceeded
        - creator_studio.session.not_found
        - creator_studio.session.expired
        - creator_studio.draft.not_found
        - creator_studio.draft.expired
        - creator_studio.draft.not_ready
        - creator_studio.transfer.not_found
        - creator_studio.transfer.expired
        - creator_studio.content.not_approved
        - creator_studio.content.archived_or_expired
        - creator_studio.workspace.mismatch
        - creator_studio.governance.blocked
        - creator_studio.consent.required
        - creator_studio.platform.not_connected
        - creator_studio.scheduling.duplicate_not_supported
        - creator_studio.override.invalid
        - workspace.member.not_found
        - workspace.member.already_active
        - workspace.member.already_suspended
        - workspace.member.self_action_forbidden
        - store_profile.not_found
        - data_source.not_found
        - channel_connection.not_found
        - integration_credential.not_found
        - campaign.not_found
        - campaign.archived
        - content_item.not_found
        - content_draft.not_found
        - content_approval.self_approval_forbidden
        - content_approval.already_decided
        - publishing_job.not_found
        - publishing_job.already_confirmed
        - publishing_job.already_cancelled
        - analytics_snapshot.not_found
        - audit_event.not_found
    ErrorModel:
      type: object
      required:
        - errorCode
        - message
        - requestId
        - retryable
        - status
      properties:
        errorCode:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
        retryable:
          type: boolean
        status:
          type: integer
          minimum: 100
          maximum: 599
    PaginationMeta:
      type: object
      required:
        - count
        - hasMore
      properties:
        nextCursor:
          type:
            - string
            - "null"
        count:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
    Warning:
      type: object
      required:
        - code
        - message
        - severity
      properties:
        code:
          type: string
        message:
          type: string
        severity:
          type: string
          enum:
            - info
            - warning
            - critical
    Readiness:
      type: object
      description: Readiness summary for UI and API consumers. It is advisory and does not execute publishing, connectors, or AI.
      required:
        - score
        - label
        - issues
      properties:
        score:
          type: number
          minimum: 0
          maximum: 100
        label:
          type: string
        issues:
          type: array
          items:
            type: string
    ProductStatus:
      type: string
      enum:
        - draft
        - active
        - archived
    StockStatus:
      type: string
      enum:
        - available
        - limited
        - out_of_stock
        - unknown
    Product:
      type: object
      description: Product catalog record. productId is canonical identity; product name is only a display field.
      required:
        - productId
        - workspaceId
        - name
        - status
        - createdAt
        - updatedAt
        - version
      properties:
        productId:
          type: string
        workspaceId:
          type: string
        name:
          type: string
        category:
          type:
            - string
            - "null"
        price:
          type:
            - number
            - "null"
          minimum: 0
        sku:
          type:
            - string
            - "null"
        stockStatus:
          $ref: "#/components/schemas/StockStatus"
        imageUrl:
          type:
            - string
            - "null"
          format: uri
        videoUrl:
          type:
            - string
            - "null"
          format: uri
        description:
          type:
            - string
            - "null"
        readiness:
          $ref: "#/components/schemas/Readiness"
        status:
          $ref: "#/components/schemas/ProductStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: string
    CreateProductRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
        price:
          type: number
          minimum: 0
        sku:
          type: string
        stockStatus:
          $ref: "#/components/schemas/StockStatus"
        imageUrl:
          type: string
          format: uri
        videoUrl:
          type: string
          format: uri
        description:
          type: string
        status:
          $ref: "#/components/schemas/ProductStatus"
    UpdateProductRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
        price:
          type: number
          minimum: 0
        sku:
          type: string
        stockStatus:
          $ref: "#/components/schemas/StockStatus"
        imageUrl:
          type: string
          format: uri
        videoUrl:
          type: string
          format: uri
        description:
          type: string
        status:
          $ref: "#/components/schemas/ProductStatus"
    ProductResponse:
      type: object
      required:
        - data
        - warnings
      properties:
        data:
          $ref: "#/components/schemas/Product"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    ProductListResponse:
      type: object
      required:
        - data
        - meta
        - warnings
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    AssetType:
      type: string
      enum:
        - image
        - video
        - document
        - audio
        - other
    RightsStatus:
      type: string
      enum:
        - needs_review
        - approved
        - rejected
        - unknown
    UsageRights:
      type: string
      enum:
        - owned
        - licensed
        - user_generated
        - unknown
    AssetStatus:
      type: string
      enum:
        - draft
        - active
        - archived
    Asset:
      type: object
      description: Asset metadata record. assetId is canonical identity; asset names and file names are display fields only. Binary upload, rights approval, publishing, connector execution, and AI execution are outside Slice 1.
      required:
        - assetId
        - workspaceId
        - name
        - type
        - rightsStatus
        - status
        - createdAt
        - updatedAt
        - version
      properties:
        assetId:
          type: string
        workspaceId:
          type: string
        linkedProductId:
          type:
            - string
            - "null"
        linkedName:
          type:
            - string
            - "null"
          description: Optional display snapshot for the linked product. It is not product identity.
        name:
          type: string
        type:
          $ref: "#/components/schemas/AssetType"
        url:
          type:
            - string
            - "null"
          format: uri
          description: Optional metadata reference. This contract does not define binary upload.
        previewUrl:
          type:
            - string
            - "null"
          format: uri
        rightsStatus:
          $ref: "#/components/schemas/RightsStatus"
        usageRights:
          $ref: "#/components/schemas/UsageRights"
        source:
          type:
            - string
            - "null"
        quality:
          type:
            - string
            - "null"
        readiness:
          $ref: "#/components/schemas/Readiness"
        status:
          $ref: "#/components/schemas/AssetStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: string
    CreateAssetRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/AssetType"
        linkedProductId:
