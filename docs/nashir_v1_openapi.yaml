        data:
          $ref: "#/components/schemas/PromptReadinessSnapshot"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    CreatorStudioPlatform:
      type: string
      description: Supported Creator Studio platforms in V1.
      enum:
        - Instagram
        - TikTok
        - YouTube
        - X
        - Snapchat
    CreatorStudioSessionSource:
      type: string
      description: Session creation source. V1 accepts manual only. OAuth and automated scraping are deferred.
      enum:
        - manual
    CreatorStudioSessionStatus:
      type: string
      description: >
        Status enum for CreatorStudioSession only. Sessions have a simpler lifecycle than context drafts.
        Do not use this enum for context draft or transfer draft status.
        Expired session invalidates all child context and transfer drafts.
      enum:
        - active
        - expired
        - blocked
    CreatorContextDraftStatus:
      type: string
      description: >
        Context draft readiness status enum. Used for CreatorContextDraft.status only.
        Transfer endpoints require ready_for_transfer. There is no reviewed state in V1.
        Do not use for session status; use CreatorStudioSessionStatus for sessions.
        Expired parent session invalidates all child context and transfer drafts.
      enum:
        - draft
        - incomplete
        - needs_consent
        - needs_platform_connection
        - needs_human_review
        - ready_for_transfer
        - blocked
        - expired
    CreatorTransferDraftStatus:
      type: string
      description: Status of a Creator Studio transfer draft. All transfer drafts begin as pending_review.
      enum:
        - pending_review
        - expired
    CreatorTransferDestinationModule:
      type: string
      description: Destination module for a Creator Studio transfer draft.
      enum:
        - content_studio
        - campaign_wizard
        - publishing_queue
        - prompt_governance
    CreatorComplianceFindingSeverity:
      type: string
      enum:
        - blocker
        - warning
        - info
    CreatorComplianceFinding:
      type: object
      description: Individual compliance or readiness finding within a CreatorReadinessAssessment. Advisory only.
      required:
        - findingId
        - rule
        - status
        - severity
        - message
      properties:
        findingId:
          type: string
        rule:
          type: string
        status:
          type: string
          enum:
            - open
            - resolved
        severity:
          $ref: "#/components/schemas/CreatorComplianceFindingSeverity"
        message:
          type: string
        requiredAction:
          type:
            - string
            - "null"
        resolvedAt:
          type:
            - string
            - "null"
          format: date-time
    CreatorManualContext:
      type: object
      description: >
        User-provided context notes for a Creator Studio session. All fields are optional and informational only.
        Must not contain OAuth tokens, private platform credentials, scraping output, or personal identifiers.
      properties:
        title:
          type: string
          maxLength: 200
          description: Short title or topic label for the session context.
        description:
          type: string
          maxLength: 2000
          description: Free-text description of the creator or content goal.
        productOrService:
          type: string
          maxLength: 200
          description: Name of the product or service being promoted. Display only; not an identity field.
        audience:
          type: string
          maxLength: 500
          description: Brief audience description. Must not contain individual personal data.
        objective:
          type: string
          maxLength: 500
          description: High-level campaign or content objective.
        notes:
          type: string
          maxLength: 2000
          description: Additional notes. Must not contain credentials, tokens, or scraping output.
      additionalProperties: false
    CreatorStudioSessionCreateRequest:
      type: object
      description: >
        Request body for creating a Creator Studio session. V1 source is manual only.
        creatorHandleRef is stored as an opaque reference only and must not be stored raw.
        OAuth ingestion and automated scraping are not available in V1.
      required:
        - source
        - selectedPlatform
      properties:
        source:
          $ref: "#/components/schemas/CreatorStudioSessionSource"
        selectedPlatform:
          $ref: "#/components/schemas/CreatorStudioPlatform"
        creatorHandleRef:
          type: string
          description: Opaque creator handle reference. Stored as reference only. Must not be stored raw. Optional.
        manualContext:
          $ref: "#/components/schemas/CreatorManualContext"
    CreatorStudioSession:
      type: object
      description: >
        Creator Studio session record. sessionId is canonical identity.
        Raw creator handle and platform tokens must not appear in responses.
        Session expires at or before expiresAt; expired session invalidates all child context and transfer drafts.
      required:
        - sessionId
        - workspaceId
        - source
        - selectedPlatform
        - status
        - createdAt
        - expiresAt
      properties:
        sessionId:
          type: string
        workspaceId:
          type: string
        source:
          $ref: "#/components/schemas/CreatorStudioSessionSource"
        selectedPlatform:
          $ref: "#/components/schemas/CreatorStudioPlatform"
        creatorHandleRef:
          type:
            - string
            - "null"
          description: Opaque creator handle reference. Raw handle must not be returned.
        manualContext:
          $ref: "#/components/schemas/CreatorManualContext"
        status:
          $ref: "#/components/schemas/CreatorStudioSessionStatus"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Max 24 hours. Expired session invalidates all child drafts.
    CreatorStudioSessionResponse:
      type: object
      required:
        - data
        - warnings
      properties:
        data:
          $ref: "#/components/schemas/CreatorStudioSession"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    CreatorContextDraftCreateRequest:
      type: object
      description: >
        Request body for persisting user-selected context references for a session.
        Only sessionId is required; selection IDs may be omitted while the draft is incomplete.
        All selection IDs must be provided before the draft status can become ready_for_transfer.
        Transfer endpoints must reject drafts not in ready_for_transfer status.
        All fields are ID references; no raw values, labels, or platform data are accepted.
        promptTemplateId must reference a non-deprecated prompt template entry.
        Use promptTemplateId as the canonical prompt template reference field.
      required:
        - sessionId
      properties:
        sessionId:
          type: string
          minLength: 1
        ideaId:
          type: string
          minLength: 1
          description: Selection ID. Required before draft can reach ready_for_transfer status.
        angleId:
          type: string
          minLength: 1
          description: Selection ID. Required before draft can reach ready_for_transfer status.
        segmentId:
          type: string
          minLength: 1
          description: Selection ID. Required before draft can reach ready_for_transfer status.
        windowId:
          type: string
          minLength: 1
          description: Selection ID. Required before draft can reach ready_for_transfer status.
        promptTemplateId:
          type: string
          minLength: 1
          description: References an approved, non-deprecated prompt template. Use promptTemplateId only. Required before draft can reach ready_for_transfer status.
    CreatorContextDraft:
      type: object
      description: >
        Creator Studio context draft. draftId is canonical identity.
        Expires at or before the parent session expiresAt.
        All fields are ID references; no raw platform values are stored.
        humanReviewRequired is always true until explicitly promoted to ready_for_transfer.
      required:
        - draftId
        - sessionId
        - workspaceId
        - ideaId
        - angleId
        - segmentId
        - windowId
        - promptTemplateId
        - status
        - humanReviewRequired
        - createdAt
        - expiresAt
      properties:
        draftId:
          type: string
        sessionId:
          type: string
        workspaceId:
          type: string
        ideaId:
          type: string
        angleId:
          type: string
        segmentId:
          type: string
        windowId:
          type: string
        promptTemplateId:
          type: string
          description: References an approved, non-deprecated prompt template.
        status:
          $ref: "#/components/schemas/CreatorContextDraftStatus"
        humanReviewRequired:
          type: boolean
          description: Always true until explicitly promoted to ready_for_transfer.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Max 24 hours; capped by parent session expiresAt. Expired draft cannot be used for transfer.
    CreatorContextDraftResponse:
      type: object
      required:
        - data
        - warnings
      properties:
        data:
          $ref: "#/components/schemas/CreatorContextDraft"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    CreatorReadinessAssessmentCreateRequest:
      type: object
      description: Request body for triggering a readiness assessment for a context draft. Result is advisory only.
      required:
        - draftId
      properties:
        draftId:
          type: string
          minLength: 1
          description: Canonical context draft identifier. Must resolve to a valid, non-expired CreatorContextDraft in the same workspace.
    CreatorReadinessAssessment:
      type: object
      description: >
        Readiness assessment for a Creator Studio context draft. Advisory only.
        Result must not auto-block or auto-approve the context draft.
        Expires after 24 hours and must be re-evaluated for each use.
      required:
        - assessmentId
        - draftId
        - workspaceId
        - overallStatus
        - findings
        - blockers
        - warnings
        - createdAt
        - expiresAt
      properties:
        assessmentId:
          type: string
        draftId:
          type: string
        workspaceId:
          type: string
        overallStatus:
          $ref: "#/components/schemas/CreatorContextDraftStatus"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/CreatorComplianceFinding"
          description: Advisory findings. Does not auto-block or auto-approve the context draft.
        blockers:
          type: array
          items:
            type: string
          description: Aggregate blocker-severity finding messages.
        warnings:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Max 24 hours. Assessment must be re-evaluated before each use.
    CreatorReadinessAssessmentResponse:
      type: object
      required:
        - data
        - warnings
      properties:
        data:
          $ref: "#/components/schemas/CreatorReadinessAssessment"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    CreatorContentStudioTransferOverrides:
      type: object
      description: Optional destination-specific overrides for Content Studio transfer. Overrides that alter the ready_for_transfer context require re-review.
      properties:
        targetContentType:
          type: string
          description: Optional content type override. Must be valid for the selected platform.
    CreatorCampaignTransferOverrides:
      type: object
      description: Optional destination-specific overrides for Campaign Wizard transfer. Must not contradict the ready_for_transfer context draft.
      properties:
        campaignName:
          type: string
          description: Optional campaign name annotation. Not a selection override.
        objective:
          type: string
          description: Optional campaign objective enum. Must match a supported objective value.
    CreatorPublishingTransferOverrides:
      type: object
      description: Optional destination-specific overrides for Publishing Queue transfer. Changing the publish window triggers re-review.
      properties:
        targetPublishWindow:
          type: string
          description: Optional publish window override. Must be validated against platform policy. Changes trigger re-review.
    CreatorPromptGovernanceTransferOverrides:
      type: object
      description: Optional destination-specific overrides for Prompt Governance transfer. reviewReason is informational only.
      properties:
        reviewReason:
          type: string
          description: Free-text annotation for the governance reviewer. Does not override the ready_for_transfer context.
          maxLength: 2000
    CreatorTransferDraftCreateRequest:
      type: object
      description: >
        Base schema for all Creator Studio transfer draft creation requests.
        Establishes that draftId is required by every transfer request.
        Specialized schemas extend this via allOf composition.
      required:
        - draftId
      properties:
        draftId:
          type: string
          minLength: 1
          description: Canonical context draft identifier. Must be in ready_for_transfer status.
    CreatorContentStudioTransferDraftCreateRequest:
      description: >
        Request body for Content Studio transfer draft creation.
        draftId is inherited from CreatorTransferDraftCreateRequest and must be in ready_for_transfer status.
        promptVersionId is required and must reference an approved, non-deprecated PromptVersion in the same workspace.
        No raw selection fields are accepted.
      allOf:
        - $ref: "#/components/schemas/CreatorTransferDraftCreateRequest"
        - type: object
          required:
            - promptVersionId
          properties:
            promptVersionId:
              type: string
              minLength: 1
              description: Canonical approved PromptVersion identifier. Must reference a non-deprecated, approved PromptVersion in the same workspace.
            overrides:
              $ref: "#/components/schemas/CreatorContentStudioTransferOverrides"
    CreatorCampaignTransferDraftCreateRequest:
      description: >
        Request body for Campaign Wizard transfer draft creation.
        draftId is inherited from CreatorTransferDraftCreateRequest and must be in ready_for_transfer status.
        No raw selection fields are accepted.
      allOf:
        - $ref: "#/components/schemas/CreatorTransferDraftCreateRequest"
        - type: object
          properties:
            overrides:
              $ref: "#/components/schemas/CreatorCampaignTransferOverrides"
    CreatorPublishingTransferDraftCreateRequest:
      description: >
        Request body for Publishing Queue transfer draft creation.
        draftId is inherited from CreatorTransferDraftCreateRequest and must be in ready_for_transfer status.
        contentId is required and must reference an approved, non-expired, non-archived Content Studio item in the same workspace.
      allOf:
        - $ref: "#/components/schemas/CreatorTransferDraftCreateRequest"
        - type: object
          required:
            - contentId
          properties:
            contentId:
              type: string
              minLength: 1
              description: Canonical Content Studio item identifier. Must be approved, non-expired, non-archived, and in the same workspace.
            overrides:
              $ref: "#/components/schemas/CreatorPublishingTransferOverrides"
    CreatorPromptGovernanceTransferDraftCreateRequest:
      description: >
        Request body for Prompt Governance transfer draft creation.
        draftId is inherited from CreatorTransferDraftCreateRequest and must be in ready_for_transfer status.
        reviewReason is informational only and does not override the ready_for_transfer context.
      allOf:
        - $ref: "#/components/schemas/CreatorTransferDraftCreateRequest"
        - type: object
          properties:
            overrides:
              $ref: "#/components/schemas/CreatorPromptGovernanceTransferOverrides"
    CreatorTransferPayloadSummary:
      type: object
      description: >
        Advisory payload summary included in CreatorTransferDraft responses.
        All fields are optional. Must not expose raw platform tokens, raw prompt text, OAuth credentials,
        or private platform API payloads. Unknown or raw platform data must not be included.
      properties:
        draftId:
          type: string
          description: Canonical context draft identifier.
        contentId:
          type:
            - string
            - "null"
          description: Canonical Content Studio item identifier. Present for publishing transfers only.
        promptVersionId:
          type:
            - string
            - "null"
          description: Canonical PromptVersion identifier. Present for Content Studio transfers only.
        destinationModule:
          $ref: "#/components/schemas/CreatorTransferDestinationModule"
        selectedPlatform:
          $ref: "#/components/schemas/CreatorStudioPlatform"
        targetContentType:
          type:
            - string
            - "null"
          description: Content type override if supplied. Present for Content Studio transfers only.
        campaignName:
          type:
            - string
            - "null"
          description: Campaign name annotation if supplied. Present for campaign transfers only.
        objective:
          type:
            - string
            - "null"
          description: Campaign objective if supplied. Present for campaign transfers only.
        targetPublishWindow:
          type:
            - string
            - "null"
          description: Publish window override if supplied. Present for publishing transfers only.
        reviewReason:
          type:
            - string
            - "null"
          description: Governance reviewer annotation if supplied. Present for prompt-governance transfers only.
        humanReviewRequired:
          type: boolean
          description: Always true. Destination module must not auto-accept the payload.
      additionalProperties: false
    CreatorTransferDraft:
      type: object
      description: >
        Creator Studio transfer draft addressed to a destination module. transferId is canonical identity.
        Transfer drafts are draft-only; no destination record creation, AI execution, or publishing occurs.
        humanReviewRequired is always true. Expires at or before parent session and context draft expiresAt.
        Raw platform tokens, raw prompt text, and credentials must not appear in payloadSummary.
      required:
        - transferId
        - sessionId
        - contextDraftId
        - workspaceId
        - destinationModule
        - status
        - humanReviewRequired
        - createdAt
        - expiresAt
      properties:
        transferId:
          type: string
        sessionId:
          type: string
        contextDraftId:
          type: string
          description: Canonical context draft identifier. References CreatorContextDraft.
        workspaceId:
          type: string
        destinationModule:
          $ref: "#/components/schemas/CreatorTransferDestinationModule"
        status:
          $ref: "#/components/schemas/CreatorTransferDraftStatus"
        humanReviewRequired:
          type: boolean
          description: Always true. Destination module must not auto-accept the payload.
        payloadSummary:
          $ref: "#/components/schemas/CreatorTransferPayloadSummary"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Max 24 hours; capped by parent session and context draft expiresAt.
    CreatorTransferDraftResponse:
      type: object
      required:
        - data
        - warnings
      properties:
        data:
          $ref: "#/components/schemas/CreatorTransferDraft"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
